<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Nunito+Sans:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261109b"><style>
.menu{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem;margin:2rem 0 1rem;padding-bottom:1.4rem;border-bottom:1px solid var(--line)}
.menu button,.menu a,.menu a:visited{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:12rem;height:2.9rem;padding:0 1.3rem;margin:0;font:inherit;font-size:.95rem;line-height:1;background:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;cursor:pointer;text-decoration:none;-webkit-appearance:none;appearance:none}
.menu button:hover,.menu a:hover{border-color:var(--accent);background:none}
.menu .on{border-color:var(--accent);color:var(--accent)}
@media(max-width:560px){.menu button,.menu a{flex:1 1 100%}}
</style>
</head>
<body>
<header><span class="brand">Écrire</span></header>
<main>
<section id="gate" class="gate">
 <label for="gpw">Mot de passe du site</label><input id="gpw" type="password" autocomplete="current-password">
 <div id="first" hidden>
  <label for="gpw2">Confirmez le mot de passe</label><input id="gpw2" type="password" autocomplete="new-password">
  <label for="token">Jeton GitHub (reste chiffré sur cet appareil)</label><input id="token" type="password" autocomplete="off">
  <details><summary>Dépôts GitHub</summary>
   <label for="owner">Identifiant GitHub</label><input id="owner"><label for="repo">Dépôt du site</label><input id="repo"><label for="repo2">Dépôt du lieu sûr</label><input id="repo2"><label for="branch">Branche</label><input id="branch"></details>
 </div>
 <label class="show"><input type="checkbox" id="sp"> Afficher les mots de passe</label>
 <p><button id="unlock" type="button">Entrer</button></p><p class="msg" id="gmsg" role="status"></p>
</section>

<section id="app" hidden>
<div class="menu" role="navigation" aria-label="Menu"><button type="button" class="mbtn" data-v="new">Nouveau texte</button><button type="button" class="mbtn" data-v="list">Consultation des textes</button><a class="mbtn" href="index.html" target="_blank" rel="noopener">Voir le site</a><a class="mbtn" href="index.html#/lieu" target="_blank" rel="noopener">Voir le lieu</a></div>
<p class="msg smsg" id="msg" role="status"></p>
<div id="v-new" hidden>
<h1 id="ftitle">Nouveau texte</h1>
<label for="file">Importer un fichier Word (.docx), PDF ou texte (facultatif)</label><input id="file" type="file" accept=".docx,.doc,.pdf,.txt,.md">
<div class="row"><div><label for="cat">Page</label>
 <select id="cat"><option value="main">Mots après maux</option><option value="grivois">Le lieu sûr</option></select></div>
 <div><label for="date">Date</label><input id="date" type="date"></div></div>
<div id="pwrow" hidden><label for="pw">Mot de passe du lieu sûr (10 caractères minimum, le même pour tous ses textes et pour votre invité)</label><input id="pw" type="password" autocomplete="new-password"><label class="show"><input type="checkbox" id="sp2"> Afficher</label></div>
<div id="catrow"><label for="catg">Rubrique</label><select id="catg"><option value="">Sans rubrique</option></select></div>
<label for="title">Titre</label><input id="title">
<label>Texte</label><div id="edbox"></div><p class="cnt" id="cnt"></p>


</div>
<div id="v-list" hidden>
<div class="mem"><div id="pie" class="pie" role="img" aria-label="Remplissage de la mémoire"></div><div id="leg" class="leg"></div></div>
<h1 style="margin-top:3rem">Mes textes</h1><div id="list"></div>

<h1 style="margin-top:3rem">Le lieu sûr</h1>
<p><button id="lieuOpen" class="ghost" type="button">Afficher les textes du lieu sûr</button> <button id="mig" type="button" hidden>Transférer mes anciens textes Privé</button></p>
<div id="llist"></div>

<h1 style="margin-top:3rem">Sauvegarde</h1>
<p class="lead">Télécharge vos textes déchiffrés dans un fichier à ranger en lieu sûr (il n’est pas protégé).</p>
<p class="row" id="bk" style="flex-wrap:wrap"><button class="ghost" data-x="main" type="button">Mots après maux</button><button class="ghost" data-x="grivois" type="button">Le lieu sûr</button><button data-x="all" type="button">Tout exporter</button></p>

</div>
<p id="lock" hidden style="text-align:center;margin-top:3rem"><button class="ghost" type="button" onclick="location.reload()">Verrouiller</button></p>
</section>
</main><footer></footer>
